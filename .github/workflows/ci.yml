# Integración continua (auditoría 03/11/2026, criterio 6.4.2): en cada push y pull request a main se compilan
# y se ejecutan todas las pruebas del backend (unitarias, de integración y funcionales con Cucumber) sobre H2.
name: Backend · pruebas

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  pruebas:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Pruebas y cobertura
        run: mvn -B -ntp test
      - name: Reporte de Cucumber y cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reportes
          path: |
            backend/target/cucumber/
            backend/target/site/jacoco/
          if-no-files-found: ignore

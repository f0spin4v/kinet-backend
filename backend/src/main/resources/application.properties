spring.application.name=kinet-backend
server.port=${PORT:8080}

# ---------- Base de datos Oracle ----------
# Local: contenedor Docker kinet-db en el puerto 1522. En la nube se reemplaza con variables de entorno.
# La contraseña NO tiene valor por defecto: sin DB_CONTRASENA la API no arranca (auditoría 03/11/2026, NC-05).
# La app entra como KINET_APP (solo DML; el libro de XP y el historial de rango son de solo inserción).
# Las tablas son de KINET_OWNER, que no puede iniciar sesión: por eso Hibernate antepone ese esquema.
spring.datasource.url=${DB_URL:jdbc:oracle:thin:@//localhost:1522/FREEPDB1}
spring.datasource.username=${DB_USUARIO:kinet_app}
spring.datasource.password=${DB_CONTRASENA}
spring.jpa.properties.hibernate.default_schema=${DB_ESQUEMA:KINET_OWNER}

# Las tablas se crean con kinet_bd.sql (raíz del proyecto), no con Hibernate
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

# ---------- Seguridad ----------
# Obligatorio y propio de cada ambiente (mínimo 32 caracteres). Sin él la API no arranca: ver JwtUtils.
kinet.jwt.secret=${KINET_JWT_SECRET:}
kinet.jwt.expiracion-minutos=60
kinet.cors.origenes=${KINET_CORS_ORIGENES:http://localhost:4200}

# ---------- Notificaciones ----------
# Se guardan y envían en un pool de hilos aparte, después del commit, sin frenar la respuesta.
kinet.notificaciones.asincronas=true

# ---------- Evidencias de entrenamiento ----------
# Fotos opcionales (JPEG, PNG o WEBP) de hasta 5 MB.
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# ---------- Tareas programadas ----------
# Cierran cronómetros abandonados, vencen participaciones de retos y cierran enfrentamientos de 24 h.
kinet.tareas.habilitadas=true
kinet.tareas.intervalo-ms=60000

# ---------- Recuperación de contraseña ----------
kinet.frontend.url=${KINET_FRONTEND_URL:http://localhost:4200}
kinet.recuperacion.expiracion-minutos=30
kinet.correo.remitente=${KINET_CORREO_REMITENTE:no-responder@kinet.app}
# Para enviar correos reales, definir MAIL_HOST, MAIL_USUARIO y MAIL_CONTRASENA (por ejemplo Gmail con
# contraseña de aplicación). Sin MAIL_HOST el enlace de recuperación se escribe en la consola.
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PUERTO:587}
spring.mail.username=${MAIL_USUARIO:}
spring.mail.password=${MAIL_CONTRASENA:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ---------- Monitoreo (auditoría 03/11/2026, criterio 6.10.6) ----------
# Solo se expone el estado de salud, en /api/sistema/health (pasa por el mismo proxy /api del frontend).
# Responde {"status":"UP"} sin detalles internos; lo consulta el monitor externo de disponibilidad.
management.endpoints.web.base-path=/api/sistema
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.health.mail.enabled=false

# ---------- Documentación de la API ----------
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method

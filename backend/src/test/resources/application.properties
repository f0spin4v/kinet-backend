spring.main.banner-mode=off
spring.datasource.url=jdbc:h2:mem:kinet;MODE=Oracle;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
# data.sql tiene tildes: sin esto, en JDK 17 sobre Windows se lee como Windows-1252 y los nombres no coinciden.
spring.sql.init.encoding=UTF-8
kinet.jwt.secret=clave-de-pruebas-kinet-con-mas-de-32-caracteres
kinet.jwt.expiracion-minutos=60
kinet.cors.origenes=http://localhost:4200
kinet.frontend.url=http://localhost:4200
kinet.recuperacion.expiracion-minutos=30
kinet.correo.remitente=pruebas@kinet.app
spring.mail.host=
# En las pruebas las notificaciones se guardan en el mismo hilo para poder verificarlas de inmediato.
kinet.notificaciones.asincronas=false
kinet.cifrado.clave=clave-de-pruebas-cifrado
# En las pruebas no corren tareas en segundo plano: cada prueba controla el tiempo.
kinet.tareas.habilitadas=false
